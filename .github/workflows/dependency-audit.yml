name: Dependency audit

# Checks production dependencies against published security advisories.
#
# Runs on every pull request and push to main, and once a week, because a new
# advisory can be published for a dependency that has not changed.
#
# The check fails on a high or critical advisory unless that exact advisory is
# listed, with a reason and an expiry date, in security/audit-exceptions.json.
# It is a separate workflow so that a newly published advisory shows up as its own
# red check instead of blocking unrelated work through the test job.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No credentials are provided or needed: the audit reads package-lock.json
      # and queries the public npm advisory endpoint.
      NPM_CONFIG_FUND: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      # Reads the lockfile only, so nothing is installed and no package script runs.
      - name: Audit production dependencies
        run: node scripts/security/audit-check.cjs
